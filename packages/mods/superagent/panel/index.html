<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>超级中介局 · 观察面板</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: "SF Mono", Menlo, monospace; background: #12141a; color: #d6dae2; margin: 0; padding: 1.2rem; }
  h1 { font-size: 1rem; margin: 0 0 .3rem; color: #8ab4f8; }
  #meta { font-size: .72rem; color: #7c8390; margin-bottom: .8rem; }
  #feed { font-size: .78rem; line-height: 1.55; white-space: pre-wrap; border-top: 1px solid #2a2f3a; padding-top: .6rem; }
  .evt { margin: .15rem 0; }
  .evt .seq { color: #5f6673; margin-right: .5rem; }
  .evt.dialogue { color: #9ad1a5; }
  .evt.quest { color: #e8c06a; }
  .evt .payload { color: #aeb6c2; }
  #err { color: #e88; font-size: .75rem; }
</style>
</head>
<body>
<h1>超级中介局 · 观察面板（只读）</h1>
<div id="meta">run: 解析中…</div>
<div id="err"></div>
<div id="feed">加载事件流…</div>
<script>
(function () {
  // run-id 来自托管路径 /panel/<run-id>/index.html（serve 面板三级：mod 自带 UI）。
  var m = location.pathname.match(/^\/panel\/([^\/]+)/);
  var runId = m ? m[1] : "";
  var feed = document.getElementById("feed");
  var err = document.getElementById("err");
  document.getElementById("meta").textContent = "run: " + (runId || "未知") + "（只读观察；写路径一律走 CLI/daemon）";

  // 对话/任务行的判定：本 mod 的机器可读投影事件名（openwiki/contracts/mod/superagent-game.md §3）。
  function cls(name) {
    if (name === "agent.dialogue") return "evt dialogue";
    if (name.indexOf("quest.") === 0 || name.indexOf("agent.recorded") === 0) return "evt quest";
    return "evt";
  }
  function render(events) {
    var lines = [];
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      lines.push('<div class="' + cls(e.event) + '"><span class="seq">#' + e.seq + '</span>'
        + e.event + ' <span class="payload"></span></div>');
      // payload 原文透传（textContent 防注入）。
      var span = document.createElement("span");
      span.className = "payload";
      span.textContent = String(e.payload == null ? "" : e.payload);
      lines[lines.length - 1] = null; // 占位：改为 DOM 追加，避免拼串注入面
      var div = document.createElement("div");
      div.className = cls(e.event);
      var seq = document.createElement("span");
      seq.className = "seq";
      seq.textContent = "#" + e.seq + " ";
      div.appendChild(seq);
      div.appendChild(document.createTextNode(e.event + " "));
      div.appendChild(span);
      feed.appendChild(div);
    }
  }
  function load() {
    fetch("/api/runs/" + encodeURIComponent(runId) + "/events?limit=200")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        err.textContent = "";
        feed.textContent = "";
        render(data.events || data.records || []);
      })
      .catch(function (e) { err.textContent = "拉取失败：" + e.message; });
  }
  if (!runId) { err.textContent = "路径缺少 run-id（应为 /panel/<run-id>/index.html）"; return; }
  load();
  // SSE 变更帧 → 重拉事件（serve 的 SSE 只通知变更，不携带内容）。
  try {
    var es = new EventSource("/api/stream");
    es.addEventListener("change", function (ev) {
      try {
        var d = JSON.parse(ev.data);
        if (!d.run || d.run === runId) load();
      } catch (_) { load(); }
    });
  } catch (_) { /* EventSource 不可用：退化为单次加载 */ }
})();
</script>
</body>
</html>
