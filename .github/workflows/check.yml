# 回归门禁：本地门禁的 CI 投影（读：openwiki/contracts/kernel/*）。
# 内核契约见 openwiki/contracts/kernel/（world / determinism /
# sandbox / lua-api / persistence / packaging / errors）。
#
# 本文件只做**校验**，不产出部署物；浏览器宿主的产物（wasm）由本地
# `scripts/build-wasm.sh` 产出，不随仓提交。
#
# 覆盖口径：
#   rust.fmt / rust.clippy / rust.test
#   参考包自测（selftest）/ 金值（golden）/ 镜像（image）
# 不含的项与原因：
#   - wasm.build / wasm.determinism：需 WASI SDK + wasm-bindgen CLI，成本高，
#     由本地门禁 `scripts/build-wasm.sh` + `scripts/wasm-lane.mjs` 承担。
#
# 另带一条**结构守卫**（不属于 playbook `gates` 章的门禁命令）：
# serde_json 不得开 `preserve_order`（字节键序即线格式）。
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# 同 ref 只保留最新一次校验（force-push / 连推时取消旧跑，省 runner）。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2（本 job 无 push，不持久化凭据）。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain（moving branch stable，pin 到当时 head）。
      # fmt/clippy 必须显式声明 components：rustup 默认 profile 不含它们。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache v2.8.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test（workspace）
        run: cargo test --workspace

      # 文档面：ver 账本、链接闭包、claims 证据闭包、AGENTS 行数预算。
      # 两个脚本「发现问题」也 exit 0（口径同 .pi/tools），故这里查 ok=1。
      - name: 文档闭包（wiki-ver + wiki-consistency）
        run: |
          set -eu
          scripts/wiki-ver.sh --check | tee /tmp/ver.txt
          grep -q 'ok=1' /tmp/ver.txt
          scripts/wiki-consistency.sh | tee /tmp/cons.txt
          grep -q 'ok=1' /tmp/cons.txt

      # 参考包是内核的活体契约：自测、逐 tick 金值、宿主镜像三件套。
      - name: 参考包自测（packs/example）
        run: |
          cargo run -q --example selftest -p ygg-sandbox \
            -- --mod packs/example

      - name: 金值（逐 tick 哈希）
        run: |
          cargo run -q --example golden -p ygg-sandbox \
            -- packs/example --check packs/example/golden.json

      - name: 宿主镜像（pack.image.js）
        run: |
          cargo run -q --example image -p ygg-host \
            -- packs/example --out hosts/h5/pack.image.js --check

      # 字节兼容的反向门禁：一旦给 serde_json 打开
      # preserve_order，键序就不再是字典序（语义相等、
      # 字节全变）。
      - name: "Guard — 不得启用 preserve_order"
        run: |
          if cargo tree -e features --workspace |
             grep -q 'serde_json feature "preserve_order"'; then
            echo "::error::preserve_order breaks byte key order" >&2
            exit 1
          fi

  # wasm 面：产物不进仓，所以必须在这里重建一次并跑双端一致。
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0

      # vendored Lua 要走 clang + sysroot；`wasm32-wasip1/eh` 是 RUSTFLAGS
      # 的锚点（不存在就说明装错了 SDK）。
      - name: 安装 WASI SDK 33.0
        run: |
          set -eu
          base=https://github.com/WebAssembly/wasi-sdk/releases/download
          curl -sSL -o /tmp/wasi.tar.gz \
            "$base/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz"
          sudo tar xzf /tmp/wasi.tar.gz -C /opt
          sudo mv /opt/wasi-sdk-33.0-x86_64-linux /opt/wasi-sdk
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1/eh

      - name: 安装 wasm-bindgen CLI（版本对齐 Cargo.lock）
        run: |
          set -eu
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: 构建 wasm 产物
        env:
          WASI_SDK_PATH: /opt/wasi-sdk
        run: bash scripts/build-wasm.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: 双端一致（50 tick + replay）
        run: node scripts/wasm-lane.mjs
