# 回归门禁：本地门禁的 CI 投影（读：playbook `gates` 章）。
# crates 触改时另按 openwiki/contracts/kernel/state-machine.md §2.11 跑字面三件套。
#
# 与 deploy-pages 的分工：本文件只做**校验**，不产出部署物；deploy-pages 只做
# wasm + 前端构建与 Pages 发布。两者共享同一套 toolchain 版本与供应链 pin 纪律
# （所有 uses 按 zizmor 纪律 pin 到 commit SHA，注释保留版本号）。
#
# 覆盖口径 = playbook `gates` 章里无需额外前置条件的必过项：
#   rust.fmt / rust.clippy / rust.test
# 不含的项与原因：
#   - wasm.build / wasm.determinism：需 WASI SDK + wasm-bindgen CLI，成本高，
#     由 deploy-pages 的 build job 与本地门禁承担（其产物即 wasm 实例）。
#
# 另带两条**结构守卫**（不属于 playbook `gates` 章的门禁命令）：
# ① ygg-store 必须留在 dev-dependencies（wasm/lint 的依赖面保持干净）；
# ② serde_json 不得开 `preserve_order`（字节键序即线格式）。
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# 同 ref 只保留最新一次校验（force-push / 连推时取消旧跑，省 runner）。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2（本 job 无 push，不持久化凭据）。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain（moving branch stable，pin 到当时 head）。
      # fmt/clippy 必须显式声明 components：rustup 默认 profile 不含它们。
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache v2.8.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test（workspace）
        run: cargo test --workspace

      - name: "Guard — wasm/lint 不得间接依赖 store"
        run: |
          fail=0
          for pkg in ygg-wasm ygg-lint; do
            if cargo tree -p "$pkg" -e normal | grep -Eq 'ygg-store v'; then
              echo "::error::$pkg must not depend on ygg-store" >&2
              fail=1
            fi
          done
          exit "$fail"

      # 字节兼容的反向门禁：一旦给 serde_json 打开
      # preserve_order，键序就不再是字典序（语义相等、
      # 字节全变）。
      - name: "Guard — 不得启用 preserve_order"
        run: |
          if cargo tree -p ygg-store -e features | grep -q preserve_order; then
            echo "::error::preserve_order breaks byte key order" >&2
            exit 1
          fi
