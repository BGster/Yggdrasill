# Workspace 根：成员一次成型（D-补充-2），后续 slice 不改 members。
[workspace]
resolver = "2"
members = [
    "crates/ygg-core",
    "crates/ygg-schema",
    "crates/ygg-modules",
    "crates/ygg-sandbox",
    "crates/ygg-lint",
    "crates/ygg-wasm",
    "crates/ygg-sim",
    "crates/ygg-host",
    "crates/ygg-capi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# members 一次成型的约束（D-补充-2）在 r3 有一次受控例外：`ygg-modules`
# 是 r1 `modules.rs` 纯解析面的**下沉**（不是第 N 个业务 crate）。理由见
# crates/ygg-modules/src/lib.rs 头注——lint 必须能在不依赖 ygg-sandbox
# （⇒ 不依赖 mlua / ygg-schema / 内核 host 面）的前提下复用同一份模块判定。
#
# members 一次成型的第二次受控例外：`ygg-sim` 是 Tier 1 原生模拟内核的**新载体**，
# 就是 `openwiki/contracts/kernel/world.md` §0 表格写的那个 crate（不是第 N 个业务 crate）。
# 它不能挂在既有 crate 下：`ygg-core` 的实体存储是行式且 `Value::Float` 是一等变体——
# 恰是 Tier 1 明令禁止的两件事（列式 SoA、禁浮点）；`ygg-sandbox` 拥有 mlua（Tier 1 必须无 VM 可编译可基准）。依赖纯度：零内部依赖、
# 运行时依赖仅 thiserror，且必须能编到 wasm32（经 ygg-wasm → ygg-sandbox → ygg-sim）。
# 理由与取证见 sim-kernel.md §1 与 topology.md 不变量 5。
#
# members 一次成型的第三次受控例外：`ygg-host` 是 `ygg/1` 线协议的**信封载体**
# （artifacts/w2-m3-protocol-plan.md §0 决策 4：「协议层不持有世界」）。它不是第 N 个
# 业务 crate，也不能挂在既有 crate 下：`ygg-sim` 明令禁 serde（快照是自写规范二进制），
# 而信封恰恰只有 serde；`ygg-sandbox` 拥有 mlua（信封必须能被宿主侧非 Rust 语言手写）；
# `ygg-core` 是值/事件/KV 的语义面（信封没有语义，只有字段）。依赖纯度：运行时仅
# serde / serde_json / thiserror + 两个内核 crate（`session` 模块要持有 `Loaded`），
# M3.3 起被两条绑定依赖：`ygg-wasm`（WASM）与 `ygg-capi`（C ABI）。
#
# members 一次成型的第四次受控例外：`ygg-capi` 是 ygg/1 协议的 **C ABI 载体**
# （artifacts/w2-m3-protocol-plan.md §3 步 3），不是第 N 个业务 crate。它不能挂在
# `ygg-wasm` 下：crate-type 与链接面完全不同（`cdylib`/`staticlib`，无 wasm-bindgen），
# 且 C 宿主不该为了用 C 面而被拉进一个 wasm 壳。依赖纯度：**只** `ygg-host`——镜像
# 解析、会话状态机、帧流打包全在内核面，绑定层一个判断都不加；零第三方运行时依赖
# （`std::ffi` 就够），所以它不会给 wasm/宿主树添任何新库。

# B1：wasm 体积预算面（research §7）：fat LTO + 体积级优化 + 单 codegen unit
# + strip。仅作用 release（wasm-pack 默认 release 出 pkg/）；门禁
# （cargo test/clippy/fmt）走 dev/test profile，不受影响。panic 行为不在此
# 设定：wasm32-unknown-unknown 默认即 abort，host release 无门禁消费面。
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true

# 基准测量口径（r1 ygg-sim）：根 [profile.release] 的 opt-level="s" 是**wasm 体积面**，
# 直接继承会把 Tier 1 的 tick 时间测成「体积优先」的数字（§5 的 16.6 ms 契约线会假红）。
# 这里单点覆盖热核 crate 的优化级；其余 crate 仍按体积面优化。
[profile.release.package.ygg-sim]
opt-level = 3
