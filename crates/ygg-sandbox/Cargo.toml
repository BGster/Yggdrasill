[package]
name = "ygg-sandbox"
version.workspace = true
edition.workspace = true

# 依赖纪律（白名单制，逐 slice 填充）：
# - S7 填充：mlua git pin（features = ["lua54", "vendored"]；wasm32 支持未进 crates.io，
#   pin 指向 mlua-rs/mlua，rev 锚定具体 commit）。
# - S8 填充：ygg-core path 依赖（FuelMeter trait 反转面实现，D-继承-4——core 定义面、
#   sandbox 实现面；S10 驱动以 &mut dyn FuelMeter 接入 run_transition）。
# - S10 填充：include_dir（ygg stdlib 嵌入）+ serde_json（信封/存档线格式）+
#   thiserror（KernelError；ygg-core 已有同版本依赖，本 crate 独立声明）。
# - S11 填充：ygg-schema path 依赖（资源 manifest / 内容寻址 / 校验机器复用；
#   **不引入 sha2**——内容寻址经 ygg-schema verify_entry，D-继承-5 双宿不变）。
# - S12 填充：sha2（状态哈希——D-继承-5：状态哈希归 sandbox、内容寻址归 ygg-schema，
#   ygg-core 零哈希）。
[dependencies]
# S8 填充：ygg-core path 依赖（FuelMeter trait 反转面实现，D-继承-4——core 定义
# 面、sandbox 实现面，S10 驱动以 &mut dyn FuelMeter 接入 run_transition）。
ygg-core = { path = "../ygg-core" }
# r3 填充：ygg-modules path 依赖（r1 `modules.rs` 的纯解析面下沉——装载器、
# 打包与静态检查三处共用同一份判定；本 crate 对解析面做 `pub use` 全量再导出，
# `ygg_sandbox::modules::*` 路径与语义不变）。
ygg-modules = { path = "../ygg-modules" }
# S7 填充：mlua git pin（features = ["lua54", "vendored"]；wasm32 支持未进 crates.io，
# pin 指向 mlua-rs/mlua，rev 锚定具体 commit；wasm 单线程不启用 send）。
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "ff96ed786295cae96f43ef1372bd22be0fbf7866", features = [
    "lua54",
    "vendored",
] }
# S10 填充：include_dir 嵌入（stdlib 目录快照，构建期定型）+ serde_json（信封/
# 存档线格式）+ thiserror（KernelError；ygg-core 已有同版本依赖，本 crate 独立声明）。
include_dir = "0.7"
serde_json = "1"
thiserror = "2"
# S11 填充：ygg-schema path 依赖（资源 manifest / 内容寻址 / 校验机器复用；
# **不引入 sha2**——内容寻址经 ygg-schema verify_entry，D-继承-5 双宿不变）。
ygg-schema = { path = "../ygg-schema" }
# S12 填充：sha2（状态哈希——D-继承-5：状态哈希归 sandbox、内容寻址归 ygg-schema，
# ygg-core 零哈希；状态哈希 = SHA-256(canonical_state_bytes)，D-继承-5 归位）。
sha2 = "0.10"

# r-store 填充：`ygg-store` 是宿主 CLI（examples/egg.rs）持久化面的端口。
# **必须留在 dev-dependencies**：examples 能见到 dev-deps，而 dev-deps **不向
# 依赖者传播**——所以 ygg-wasm / ygg-lint 的依赖树里不会出现 ygg-store，更不会
# 出现 rusqlite（`default` 只转发到这里的 feature，见下）。
[dev-dependencies]
ygg-store = { path = "../ygg-store" }

# r-evo 填充：sqlite 后端是宿主的**默认**——`cargo build --example egg` 不带任何
# 旗标即编入 sqlite，新局默认后端见 `ygg_store::DEFAULT_BACKEND`。
# 回退构建（关掉 sqlite）走 `--no-default-features`；此时 `--store sqlite` 必须
# fail-closed 报「本构建未启用 sqlite 后端」。
#
# `default = ["store-sqlite"]` 能成立的两个前提（别顺手改掉）：
# - `ygg-store` 不是 optional（也不可能是：dev-dependencies 不允许 optional），
#   所以只能用「转发到依赖 feature」这种写法，`dep:ygg-store` 不适用；
# - 转发目标落在 **dev-dependencies** 上，对「无 dev 图」的构建是**空指向**：
#   ygg-wasm / ygg-lint 的图里没有 ygg-store，于是不拉包、不编 C。
#   **一旦把 ygg-store 挪进 [dependencies]，这行就会真把 rusqlite 灌进 wasm32**
#   ——CI 的 `cargo tree -e normal` 守卫专拦这条。
[features]
default = ["store-sqlite"]
store-sqlite = ["ygg-store/sqlite"]
