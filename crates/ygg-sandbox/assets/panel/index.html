<!doctype html>
<!-- Yggdrasill · 内置面板列表页（无构建；宿主 include_dir! 编译期嵌入）。
     四级形态：① mod 列表（#/）② mod 实例列表（#/mods/<key>）③ 局内存档（#/runs/<id>）
     为 egg 原生；第四级（mod 自带 UI）以 iframe 托管，宿主零解析零渲染（P11 宿主零语义）。
     三条 hash 路由与返回导航（#nav-back 空容器，由前端按路由推导）都是纯前端逻辑。 -->
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yggdrasill · runs 观察台</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header>
    <h1>Yggdrasill · runs 观察台</h1>
    <span id="runs-root" title="观察目标 runs-root">…</span>
    <span id="version"></span>
    <span id="sse-state" class="sse sse-init">连接中</span>
    <nav id="nav-back"></nav>
  </header>
  <main id="view"><p class="hint">加载中…</p></main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
