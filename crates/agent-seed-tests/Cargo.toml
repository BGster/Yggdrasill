[package]
name = "agent-seed-tests"
version.workspace = true
edition.workspace = true
publish = false

# 纯登记 crate：没有 src/、没有 tests/，只把 Mod 内的套件登记成 target。
# 迁移期专用——每迁一个域到 Lua，就删掉对应 [[test]] 与那批用例；
# 全部迁完后本目录整体删除（届时 Mod 测试只由 `examples/selftest.rs` 执行）。

[dev-dependencies]
ygg-sandbox = { path = "../ygg-sandbox" }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "agent_seed_semantics"
path = "../../.ygg/mods/agent-seed/tests/agent_seed_semantics.rs"
