[package]
name = "agent-seed-tests"
version.workspace = true
edition.workspace = true
publish = false

# 门禁薄壳（不是 Rust 兜底用例）。
#
# Mod 行为套件已全部迁到 Lua（`.ygg/mods/agent-seed/tests/*.lua`，由
# `cargo run -q --example selftest` 执行）。本 target 之所以还在，是因为宿主的
# 三套门禁（`crates/ygg-sandbox/examples/egg.rs` 的 `verify_gates`）把
# `cargo test -p ygg-sandbox --test agent_seed_semantics` 硬编码为第三条，
# 而 egg.rs 是 non-negotiable host（AGENTS §1.7：绝不改它）。删掉本 target 会让
# `gate.verify_suite --mode all` 直接失败。
#
# 它不测任何 Mod 行为，只做一件真实的事：断言那个 Lua 套件**仍然存在且非空**——
# 否则第三条命令会退化成「跑一个空目标」的静默通过。

[[test]]
name = "agent_seed_semantics"
path = "tests/agent_seed_semantics.rs"
