[package]
name = "ygg-schema"
version.workspace = true
edition.workspace = true

# 白名单：serde/serde_json（契约结构）+ thiserror（错误面）+ sha2（D-A2 内容寻址，
# D-继承-5 dual-homing）+ jsonschema（draft 2020-12 校验；default-features = false）。
# 对 ygg-core 仅为模块边界文档声明的单向依赖边，无代码依赖——本 crate 不依赖 ygg-core。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
jsonschema = { version = "0.60", default-features = false }
