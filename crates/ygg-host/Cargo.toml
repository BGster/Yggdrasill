[package]
name = "ygg-host"
version.workspace = true
edition.workspace = true
description = "Yggdrasill ygg/1 线协议的信封层：JSON Schema + Rust 类型 + 边界浮点拒收"

# 依赖纪律（计划稿 artifacts/w2-m3-protocol-plan.md §0 决策 2/3/4）：
# - 运行时**只有**三件：serde（信封结构的 derive）、serde_json（v1 唯一的线格式，
#   也是边界浮点拒收要看的 `Number` 面）、thiserror（错误面）。不引 sha2 / base64 /
#   jsonschema——摘要与 base64 在协议层只是**字符串搬运**，校验与编解码在各自的
#   crate（ygg-schema / 绑定层）里，协议层不持有世界（决策 4）。
# - `serde_json` 不得开启 `preserve_order`：信封的键序必须与 serde 的声明序一致，
#   否则 schema 与 Rust 两侧的「同一份字节」无从对账（与 ygg-core / ygg-store 同款约束）。
# - **不依赖 ygg-sim / ygg-sandbox**：信封是宿主与内核之间的边界，不是内核的类型面；
#   一旦依赖内核，宿主侧（TS / GDScript / C#）就再也拿不到一份可独立阅读的契约。
#   组件 id / 实体 id 因此在本 crate 里是本地别名（见 proto.rs 的 `EntityId`）。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 唯一的 dev-dependency：schema 一致性用例用 ygg-schema 的 ValidatorSet 校验
# `packages/schema/protocol/ygg-1.schema.json`（draft 2020-12 锁定、离线、无 format 断言）。
# 只进测试面——运行时依赖表里没有它，wasm32 树（ygg-wasm → ygg-sandbox）也不会因
# 这份 dev-dep 被拉进 jsonschema。
[dev-dependencies]
ygg-schema = { path = "../ygg-schema" }
