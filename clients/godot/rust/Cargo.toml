[package]
name = "ygg-godot"
version = "0.1.0"
edition = "2021"
description = "Yggdrasill Godot 客户端绑定：把 ygg-core/ygg-sandbox 原生链接进 Godot 4"

# 独立 workspace：Godot 侧是独立 CDylib 构建产物（gdext 的链接/ABI 约束
# 与仓库主 workspace 无关）。空 [workspace] 表 = 本目录自成 workspace 根，
# 阻断对上层 Yggdrasill workspace 的继承（版本/edition 在此显式声明）；
# path 依赖 ygg-sandbox 时，cargo 对该包按它自己的 workspace（仓库根）解析
# 继承——两侧互不污染。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# gdext：与 Godot 4.7.2-stable 匹配（0.5.x 支持 api-4-2..api-4-7；显式钉
# api-4-7 防默认 minor 漂移——与 project.godot 的 features 声明同档）。
godot = { version = "0.5.5", features = ["api-4-7"] }
# 内核驱动面（KernelFacade + dispatch JSON 信封）。
ygg-sandbox = { path = "../../../crates/ygg-sandbox" }
serde_json = "1"
